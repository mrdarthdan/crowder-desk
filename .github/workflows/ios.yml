name: Build iOS app

# Builds an unsigned .ipa for sideloading. Download it from the run's artifacts and
# install it with Sideloadly (or AltStore), which signs it with your Apple ID.
# Free Apple ID signing lasts 7 days; re-sign the same .ipa to keep using it.

on:
  push:
    branches: [ios]
    paths-ignore: ['README.md']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm install

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      # The Xcode project is generated fresh each run (src-tauri/gen is not committed).
      - name: Create the Xcode project
        run: npx tauri ios init --ci

      - name: App icons
        run: npx tauri icon app-icon.png

      # Home screen / lock screen widget (ios-widget/), added as a WidgetKit extension.
      - name: Add the widget to the Xcode project
        run: |
          python3 scripts/ios-add-widget.py
          cd src-tauri/gen/apple && xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: npx tauri ios build --ci --target aarch64 --no-sign

      # Unpack the build, ad-hoc sign the widget and the app with their entitlements
      # (only the App Group), and pack it again. An unsigned app carries no entitlements,
      # and Sideloadly/AltStore only grant what the signature asks for.
      - name: Package the .ipa
        run: |
          set -euo pipefail
          rm -rf out pkg && mkdir -p out pkg
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' -print -quit || true)
          if [ -n "$ipa" ]; then
            (cd pkg && unzip -q "../$ipa")
          else
            app=$(find src-tauri/gen/apple/build -path '*iphoneos*' -name '*.app' -type d -print -quit || true)
            [ -z "$app" ] && app=$(find src-tauri/gen/apple/build -name '*.app' -type d -print -quit)
            [ -z "$app" ] && { echo "::error::No .ipa or .app was built."; find src-tauri/gen/apple/build -maxdepth 4; exit 1; }
            mkdir -p pkg/Payload && cp -R "$app" pkg/Payload/
          fi
          app=$(find pkg/Payload -maxdepth 1 -name '*.app' -type d -print -quit)
          appex="$app/PlugIns/CrowderDeskWidget.appex"
          [ -d "$appex" ] || { echo "::error::The widget extension is missing from the app."; ls -la "$app"; exit 1; }
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name '*.dylib' -o -name '*.framework' \) -exec codesign -f -s - {} \;
          fi
          codesign -f -s - --entitlements ios-widget/widget.entitlements "$appex"
          codesign -f -s - --entitlements ios-widget/app.entitlements "$app"
          echo "Widget entitlements:"; codesign -d --entitlements - --xml "$appex" | plutil -p - || true
          echo "App entitlements:"; codesign -d --entitlements - --xml "$app" | plutil -p - || true
          (cd pkg && zip -qry ../out/CrowderDesk.ipa Payload)
          unzip -l out/CrowderDesk.ipa | grep -q 'PlugIns/CrowderDeskWidget\.appex/' || { echo "::error::The widget extension is missing from the .ipa."; exit 1; }
          ls -lh out/CrowderDesk.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: crowder-desk-ios
          path: out/CrowderDesk.ipa
          retention-days: 30
