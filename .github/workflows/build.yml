name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Signs the update files the app checks for. Add both as repository secrets
      # (Settings → Secrets and variables → Actions). The password secret may be empty.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      # Fails in seconds (instead of after the whole build) if the key secret is wrong.
      # Prints only the length and the key's comment line, never the key.
      - name: Check the update signing key
        shell: bash
        run: |
          key="$TAURI_SIGNING_PRIVATE_KEY"
          if [ -z "$key" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set."; exit 1
          fi
          kind=$(printf %s "$key" | base64 -d 2>/dev/null | head -n 1 | tr -d '\r')
          echo "Secret is ${#key} characters. Comment line: ${kind:-<not base64>}"
          case "$kind" in
            *"public key"*)
              echo "::error::TAURI_SIGNING_PRIVATE_KEY holds the PUBLIC key (crowder-desk.key.pub). Paste the contents of crowder-desk.key instead."; exit 1 ;;
            *"secret key"*)
              if [ "${#key}" -lt 300 ]; then
                echo "::error::TAURI_SIGNING_PRIVATE_KEY looks cut off (${#key} characters; the full key is about 348). Paste the whole contents of crowder-desk.key."; exit 1
              fi ;;
            *)
              echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't a Tauri private key. Paste the whole contents of crowder-desk.key."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm install

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/set-version.mjs --check "${GITHUB_REF_NAME#v}"

      # Tag builds: build, create the GitHub release, and attach the installers,
      # their signatures and latest.json (what the in-app updater reads).
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Crowder Desk ${{ github.ref_name }}
          releaseBody: See the commits since the last release.
          releaseDraft: false
          includeUpdaterJson: true

      # Manual runs: just build the installers.
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: crowder-desk-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
