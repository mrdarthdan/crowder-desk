[package]
name = "crowder-desk"
version = "1.4.0"
description = "Crowder Desk desktop widget"
authors = ["Daniel Crowder"]
edition = "2021"

[lib]
name = "crowder_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Secrets: Windows Credential Manager on the desktop, the Keychain on iPhone.
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Desktop-only plugins (tray widget, window position, autostart, Ctrl+Alt+Space, updater).
# The iPhone build leaves these out.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
